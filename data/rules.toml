# The numbers the game is played by.
#
# This file is built into the game, so the game runs without it. To change
# the game, do not edit this file: put the numbers you want to change, and
# only those, in a file of the same shape in a mod's folder.

[match]
# Outs a side gets in its innings.
outs = 3

# In a match you come to bat in the last innings already behind. This is by
# how many runs, for each skill level.
[match.runs_down]
easy = 1
medium = 2
hard = 3

# Strikes that put a batter out, and balls that walk him to first.
[count]
strikes = 3
balls = 4

# ---------------------------------------------------------------------------
# The full match: innings after innings against another side. Only your own
# innings are played. The other side's are made up.
[full_match]
# The innings each side has. A match that is level after them goes on, an
# innings at a time, until one side is ahead.
innings = 9
# With the zinger hit mod on every ball you hit is a home run, so the other
# side is given this many innings' worth of runs in each of theirs.
zinger_innings = 3

# How likely the other side is to make each number of runs in an innings,
# for each skill level: the first number is for no runs, the second for
# one, and so on. Only how the numbers compare with one another matters.
# As they are, the other side makes about one run an innings on easy, a
# little under two on medium and two and a half on hard.
[full_match.runs]
easy = [44, 30, 15, 7, 3, 1]
medium = [28, 24, 19, 13, 8, 4, 3, 1]
hard = [16, 19, 20, 17, 12, 8, 4, 3, 1]

# Once it is settled how many runs an innings of theirs comes to, it is
# played out on paper, a pitch at a time, to come to just that: who struck
# out, who walked, who hit what and where. These are the chances it is
# played by.
[full_match.their_batting]
# The share of the pitches to them that are in the strike zone.
zone = 0.5
# How often they swing at a pitch in the zone, and at one outside it.
swing = [0.66, 0.27]
# How often such a swing meets the ball.
contact = [0.85, 0.58]
# The share of the balls they meet that go foul.
foul = 0.4
# What a ball they put in play is likely to come to. Only how the numbers
# compare with one another matters. The hits all become likelier in an
# innings that is to come to many runs, and rarer in one that is to come to
# few.
ground_out = 31
fly_out = 29
single = 25
double = 8
triple = 1
home_run = 6

# ---------------------------------------------------------------------------
# A tournament: full matches, one after another, against sides with names.
[tournament]
# The numbers of innings a tournament's matches can be chosen to have.
innings = [3, 5, 9]
# A batter's averages are listed among the best once he has had a turn for
# every this many innings his side has batted in: at 3, a turn for each
# match of three innings, and three for each match of nine.
innings_a_turn = 3

# The sides there are to play against. A tournament draws the ones it needs
# from them: seven for a cup or for two groups of four, five for a league.
# Each has its name in capitals, the same in four letters at the most for a
# scoreboard, its colour, and how strong it is.
#
# A side's strength leans the runs it is likely to make in an innings, which
# are the full match's for the skill level. At 1 it makes what the other
# side of a full match makes, above 1 more, and below it fewer. On medium a
# side at 0.8 makes about one and a quarter runs an innings, and one at 1.25
# about two and a half.
[tournament.sides.rooks]
name = "ASHCOMBE ROOKS"
short = "ROOK"
colour = "#8f94a8"
strength = 1.25

[tournament.sides.kites]
name = "FENMOUTH KITES"
short = "KITE"
colour = "#e0603a"
strength = 1.15

[tournament.sides.newts]
name = "TARNSIDE NEWTS"
short = "NEWT"
colour = "#e8a530"
strength = 1.1

[tournament.sides.terns]
name = "QUAYSIDE TERNS"
short = "TERN"
colour = "#7fc4e8"
strength = 1.05

[tournament.sides.moths]
name = "HOLLOWBECK MOTHS"
short = "MOTH"
colour = "#c9a6e0"
strength = 1.0

[tournament.sides.coots]
name = "SALTMARSH COOTS"
short = "COOT"
colour = "#4fb3a5"
strength = 1.0

[tournament.sides.moles]
name = "BRICKFIELD MOLES"
short = "MOLE"
colour = "#c98a4b"
strength = 0.95

[tournament.sides.voles]
name = "LOWER WEIR VOLES"
short = "VOLE"
colour = "#9bbf5a"
strength = 0.9

[tournament.sides.hares]
name = "THISTLEY HARES"
short = "HARE"
colour = "#d9c27a"
strength = 0.85

[tournament.sides.toads]
name = "PUDDLEFORD TOADS"
short = "TOAD"
colour = "#6fae4f"
strength = 0.8

# ---------------------------------------------------------------------------
# The pitch. One table for each skill level.
#
# speed    How long the pitch takes: the larger, the slower. A whole number
#          is picked from low to high, both included.
# swing    How far the ball curves sideways each frame, in pixels:
#          base + over / n, with n picked from 1 to parts.
# dip      How far it drops each frame, worked out the same way.
# target   Where the pitcher aims: a corner and a size, in pixels of the
#          batting view. The curve then carries the ball off it.
# marker_frame  The frame of the pitcher's wind-up on which the player is
#          shown where the ball will cross. The ball leaves his hand on
#          frame 78, so later is harder.
# aim_ease The aiming ring closes this share of the gap to the pointer each
#          frame: 1 / aim_ease. Larger is more sluggish.
# band     The ball can be hit while its shadow is between these heights.
# window   What a swing does to a ball that is in the band this many frames
#          after the click: [frames, quality, power]. Quality is one of
#          "poor", "medium_poor", "medium" and "good". A lower power sends
#          the ball further. Frames not listed are a miss.

[pitch.easy]
speed = { low = 70, high = 70 }
swing = { base = 0.0, over = 0.0, parts = 1 }
dip = { base = 0.0, over = 0.0, parts = 1 }
target = { x = 235.0, y = 175.0, width = 110.0, height = 140.0 }
marker_frame = 15
aim_ease = 5.0
show_zone = true
band = { top = 320.0, bottom = 395.4 }
window = [
    [7, "medium_poor", 18.0],
    [8, "medium_poor", 17.0],
    [9, "medium", 15.0],
    [10, "good", 15.0],
    [11, "good", 14.0],
    [12, "good", 15.0],
    [13, "medium", 18.0],
]

[pitch.medium]
speed = { low = 60, high = 60 }
swing = { base = -0.5, over = 2.0, parts = 5 }
dip = { base = 0.0, over = 1.0, parts = 10 }
target = { x = 230.0, y = 190.0, width = 110.0, height = 110.0 }
marker_frame = 30
aim_ease = 10.0
show_zone = false
band = { top = 330.0, bottom = 381.5 }
window = [
    [8, "poor", 25.0],
    [9, "medium_poor", 18.0],
    [10, "good", 14.0],
    [11, "good", 14.0],
    [12, "medium", 17.0],
]

[pitch.hard]
speed = { low = 35, high = 49 }
swing = { base = -1.5, over = 3.0, parts = 5 }
dip = { base = 0.0, over = 1.0, parts = 5 }
target = { x = 230.0, y = 170.0, width = 110.0, height = 130.0 }
marker_frame = 46
aim_ease = 20.0
show_zone = false
band = { top = 340.0, bottom = 366.4 }
window = [
    [8, "poor", 30.0],
    [9, "medium", 17.0],
    [10, "good", 14.0],
    [11, "medium", 18.0],
]

# Numbers every pitch shares.
[throw]
# Frames the pitcher waits before starting his wind-up, on top of the time
# the pitch itself will take.
settle = 28
# The frame of the wind-up on which the ball leaves his hand.
release_frame = 78
# The curve moves the pitcher's aim by this many pixels for each pixel of
# swing and of dip.
swing_lead = 40.0
dip_lead = 30.0
# How the ball speeds up as it nears: each frame it covers this share of the
# way for every pixel its shadow has already come.
approach = 30.0
# The ball's size: this much at the pitcher's hand, growing by `growth` for
# each pixel its shadow has come.
size = 1.05
growth = 0.02
# Once past the batter the ball fades by this much a frame.
fade = 0.1

# ---------------------------------------------------------------------------
# The ball off the bat.
[hit]
# Aiming to one side of the ball sends it the other way. This is how many
# pixels the hit moves for each pixel the ring is off.
pull = 3.0
# The red pointer on the outfield shows where a hit would go. In the
# original it is not seen until the game shows where the pitch will cross.
# Set this to true to have it out from the start, following the ring as if
# the pitch were coming down the middle.
pointer_before_pitch = false
# Frames the ball is watched leaving the bat before the view changes to the
# field.
watch = 61
# Frames after the fourth ball before the view changes for the walk.
walk_wait = 41
# How hard the ball goes up: lift - power / power_drag, plus the height the
# ring was off divided by lift_aim.
lift = 25.0
lift_aim = 8.0
power_drag = 3.0
gravity = 0.4
# What is left of the ball's speed up when it bounces in the batting view.
bounce = 0.8

# The ball over the field.
[field]
# Where the field sits on screen once the view has changed.
x = 40.0
# A hit that goes straight is at its mark after power * pace frames. A hit
# sent to one side covers as much of the field in that time: more of the
# screen where the field is drawn larger, as right field is, and no more of
# the ground.
pace = 8.0
# Sideways aim carries over to the field at 1 / aim_share.
aim_share = 1.3
# The ball's lift over the field, as a share of its lift off the bat.
lift_share = 0.1286
gravity = 0.03
# Drag: each frame the ball loses this share of its speed for every 40
# pixels the ring was off in height, times how far it has gone from home,
# squared, over 21056. How far it has gone is counted as the distance to
# the wall is, and not in pixels of the screen, so that a ball is held back
# alike whichever way it goes. The original counted pixels and divided by
# 1500, which is the same thing for a hit that goes straight, and held a
# ball back the more the larger its part of the field is drawn.
drag = 0.002
drag_aim = 40.0
drag_reach = 21056.0
# What a bounce leaves: of its speed along the ground, and of its speed up
# (which is also capped).
bounce_run = 0.5
bounce_lift = 0.4
bounce_cap = 1.0
bounce_loss = 0.05
# How far the wall is, and how high the ball must be to clear it.
wall = 820.0
clear = 25.0
# What bouncing off the wall leaves of the ball's speed.
wall_bounce = 0.3
# A fielder stops this far out.
fielder_reach = 845.0
# A fielder catches a ball that comes down to this height where he waits.
catch_height = 20.0
# How fast a thrown ball goes, in pixels a frame, and how close to the base
# counts as there.
throw_speed = 2.0
throw_near = 10.0
# Frames a fielder takes to pick the ball up, and then to let go of it.
pick_time = 20
throw_time = 15
# A play that has not ended by itself after this many frames is called dead.
longest = 2400

# Fielders' running speed in pixels a frame.
[field.fielder_speed]
easy = 0.4
medium = 0.45
hard = 0.49

# ---------------------------------------------------------------------------
# The zinger hit mod: every ball the bat meets is a home run.
[zinger]
# How far from home the ball comes down, the distance to the wall being 1.
# This is the least: for the worst-timed swing that still meets the ball,
# with the ring held well off it. The most is given for each skill level
# further down.
carry_worst = 1.1
# Of the most, this much is for holding the ring on the ball, and the rest is
# for the timing. A ring `aim_reach` pixels off the ball or more gets none of
# it. Keep it smaller than what one frame of timing is worth, or a worse-timed
# swing could go further than a better one.
aim = 0.15
aim_reach = 80.0
# Frames a ball hit level is in the air, and the power it leaves the bat with
# in the batting view, where lower is faster: for the worst-timed swing that
# still meets the ball, and for the best. A swing between the two gets a
# number between.
hang = { worst = 170.0, best = 200.0 }
power = { worst = 14.0, best = 9.0 }
# How high a ball hit level goes, in pixels of the field.
level_peak = 130.0
# Holding the ring below the ball skies it, and holding it above drives it
# low. The whole effect comes with the ring `shape_reach` pixels above or
# below, and less of it nearer. `hang` is how many times as long the ball is
# in the air as one hit level, and `peak` how high it goes. A ball is never
# kept so low that it would not clear the wall.
shape_reach = 50.0
sky = { hang = 2.5, peak = 380.0 }
drive = { hang = 0.6, peak = 45.0 }
# A ball that comes down no further off than this is in the stands. Further,
# it is out of the park.
stands = 1.3
# How many times its usual size the ball is drawn over the field. At its
# usual size it is two pixels across and easily lost against the crowd. At
# three times that it is half as tall as a fielder.
ball_size = 1.5
# How far the wall is in feet, for telling the player how far the ball went.
wall_feet = 400.0

# The most a zinger does at each skill level: the best-timed swing with the
# ring on the ball.
[zinger.carry_best]
easy = 2.0
medium = 2.125
hard = 2.25

# With the mod on a match takes more winning: this is how many runs behind
# you start, in place of the numbers under [match].
[zinger.runs_down]
easy = 3
medium = 5
hard = 8

# ---------------------------------------------------------------------------
# The butterfingers mod: fielders let the ball go.
[butterfingers]
# How often, out of every hundred goes at the ball: one number for each
# level the mod can be set to on the menu, the lowest first. A go is a catch,
# a pick-up, or taking a throw at a base. There are as many levels on the
# menu as there are numbers here.
chance = [20, 40, 60, 80, 100]
# A ball that is let go rolls off at this many pixels a frame, any way, and
# pops up this hard.
roll = 0.8
pop = 0.4
# Frames a fielder is at a loss before he goes after a ball he let go, and
# frames the fielder at a base takes to gather a throw he dropped.
fumble_time = 25
gather_time = 50
# Frames the word of what he did stays up over him.
told_time = 80

# ---------------------------------------------------------------------------
# The knuckleball mod: pitches sway from side to side on the way in.
[knuckleball]
# How far to either side, in pixels as the ball comes by the batter. Further
# off, where the ball is drawn smaller, it sways by less.
sway = 16.0
# How many times it goes from side to side and back between the pitcher's
# hand and the batter.
turns = 2.5

# ---------------------------------------------------------------------------
# The heat check mod: runs make the pitches faster, and strikes slow them.
[heat]
# Each run scored takes this share off the time the next pitch takes, and
# each strike puts it back.
step = 0.06
# The most runs' worth of heat there can be.
most = 8

# ---------------------------------------------------------------------------
# The mystery pitch mod: each pitch is a fastball, a change-up or a curve.
[mystery]
# How long a fastball and a change-up take, the time a pitch takes at the
# skill level being 1.
fast = 0.7
slow = 1.5
# How much more a curve swings each frame, to one side or the other, and how
# much more it drops, in pixels.
curve_swing = 1.5
curve_dip = 0.4
# Frames the name of the pitch stays up once it has been thrown.
told_time = 70

# ---------------------------------------------------------------------------
# The called shot mod: click the outfield before a pitch, and a hit that
# comes down there is worth runs on top.
[called_shot]
# The part of the field a shot can be called for, in pixels of the overhead
# field.
area = { x = 70.0, y = 125.0, width = 390.0, height = 115.0 }
# The target is the arcade game's, with the same rings, drawn this many
# times its size.
size = 0.6
# The runs a hit is worth that first comes down in each ring, from the
# centre out.
runs = [3, 2, 1, 1]
# Frames the word that the shot came off stays up.
told_time = 150

# ---------------------------------------------------------------------------
# The hot bat mod: each hit in a row widens the timing window.
[hot_bat]
# Each hit in a row adds a frame to each end of the window, as good as the
# frame that was the end. This is the most frames it can add to each.
most = 3

# ---------------------------------------------------------------------------
# The sudden death mod: one strike and the batter is out, but runs count
# double.
[sudden_death]
# Strikes that put a batter out, in place of the number under [count].
strikes = 1
# How many each run counts for.
runs = 2

# ---------------------------------------------------------------------------
# The golden ball mod: now and then a pitch is gold.
[golden]
# One pitch in this many is gold: the fifth, the tenth, and so on.
every = 5
# How many each run scored off a golden ball counts for.
runs = 3

# ---------------------------------------------------------------------------
# The pinball park mod: the ball keeps most of its speed when it bounces.
[pinball]
# The share of its speed the ball keeps, off the ground and off the wall and
# the foul lines: one number for each level the mod can be set to on the
# menu, the lowest first. As the game was it keeps half off the ground and
# three tenths off the wall.
keeps = [0.6, 0.7, 0.8, 0.85, 0.9]
# The most a bounce can send the ball up by, in pixels a frame. As the game
# was it is 1.
hop = 1.5
# A fielder can only get hold of a ball that is no higher off the ground than
# this, in pixels. As the game was he has any ball he gets to.
low = 6.0

# ---------------------------------------------------------------------------
# The moon ball mod: a hit floats to where it was going.
[moon]
# How many times as long the ball takes over its flight: one number for each
# level the mod can be set to on the menu, the lowest first. It goes the same
# way and comes down in the same place.
slow = [1.5, 2.0, 3.0, 4.0, 5.0]

# ---------------------------------------------------------------------------
# The turbo runners mod: runners who are fast, and can go on at any time.
[turbo]
# How many times as fast they go round the bases: one number for each level
# the mod can be set to on the menu, the lowest first.
speed = [1.5, 2.0, 2.5, 3.0, 4.0]

# ---------------------------------------------------------------------------
# The night game mod: the stadium is dark.
[night]
# How much is left of the red, the green and the blue of the stadium.
dark = [0.3, 0.34, 0.55]
# A home run flashes the lights for this many frames, lit and dark by turns
# every `flash_every` of them. Lit, everything is this much brighter than by
# day, 1 being white.
flash_time = 54
flash_every = 6
glare = 0.22

# ---------------------------------------------------------------------------
# The shift mod: the fielders stand where you have been hitting the ball.
[shift]
# They go by where the last `memory` fair balls came down, and do not move
# until there have been `least` of them.
memory = 8
least = 3
# The middle of the field is taken to be where those balls went on the whole,
# from one foul line to the other. The fielders' own middle moves this share
# of the way there from the real one, and never more than `most` of the
# field's width. The outfielders and the shortstop stand as far to either
# side of it as the lines allow.
follow = 1.0
most = 0.3
# The corner of the batting view says which way they have gone once their
# middle has moved this much of the field's width.
told = 0.05

# ---------------------------------------------------------------------------
# The tired arm mod: the pitcher tires as he throws, until another comes in.
[tired_arm]
# He pitches as he always did for his first `fresh` pitches, and tires from
# there until he is spent, by his `spent`th.
fresh = 10
spent = 30
# When he has thrown this many a fresh pitcher comes in for him.
relief = 36
# Spent, his pitches take this many times as long, and the area he aims at
# is this many times as wide and as high, about the same middle, so that
# more of them miss the strike zone. Part of the way to spent he is that
# part of the way to both.
slow = 1.3
wild = 1.5
# Frames the word that a new pitcher has come in stays up.
told_time = 100

# ---------------------------------------------------------------------------
# The stolen bases mod: send a runner on while the pitcher winds up.
[steal]
# A pitch that is not hit is in the catcher's glove as it goes by. He takes
# from `low` to `high` frames to let go of it, picked afresh each time, and
# his throw to the base goes at this many pixels a frame. A runner takes 211
# frames from one base to the next, and the wind-up is 78 of them, so the
# sooner in it he is sent the likelier he is to be there first.
pop = { low = 20, high = 50 }
throw_speed = 2.0
# Frames the word of how it came out stays up.
told_time = 110
# In a full match the other side steals too, on paper. Before a batter's
# turn, a runner on first with second empty goes this often. One on second
# with third empty goes that share of as often. Either gets there this
# often, and is out the rest.
their_chance = 0.07
their_third = 0.25
their_safe = 0.72

# ---------------------------------------------------------------------------
# The hit the sign mod: signs on the outfield wall that pay for being struck.
[sign]
# How many signs there are, side by side along the wall.
count = 5
# How far across the field the middle of the first sign is, and of the
# last, from 0 on the left foul line to 1 on the right. The rest are spread
# evenly between. Each is this wide, the same way. As they are, all five can
# be seen on the wall in the batting view, where the red pointer on a sign
# is a hit at it.
first = 0.24
last = 0.80
width = 0.10
# A ball that comes to the wall at a sign no higher than this has struck it.
# The wall itself is cleared at 25, under [field]: lower than that the ball
# comes back off the sign, and higher it goes off the top of the sign and
# out, a home run all the same.
high = 60.0
# The runs a ball that strikes the lit sign is worth, on top of whatever it
# earns the usual way, and one that strikes any other sign.
lit = 3
unlit = 1
# Frames the word that a sign was struck stays up.
told_time = 150

# ---------------------------------------------------------------------------
# The rally mod: batters who reach base one after another make runs worth
# more.
[rally]
# Each batter in a row who reaches base makes a run worth one more, until
# somebody is out. This is the most batters that count: with four, a run is
# never worth more than five.
most = 4

# ---------------------------------------------------------------------------
# The clutch mod: runs count for more when they are hardest to come by.
[clutch]
# How many each run counts for on a pitch thrown with one out left to the
# side, which is two out as the game is, and a runner on second or third.
runs = 2

# ---------------------------------------------------------------------------
# The bullet time mod: hold the space bar to slow the pitch near the plate.
[bullet_time]
# While it is held back the ball moves on one frame in this many.
slow = 3
# It can be held back over the last this many frames of its flight, which
# is while it comes to the plate and goes by, and not before.
near = 40
# The meter has this many frames of holding back in it when it is full, as
# it is when a game starts. Each frame the ball is held back takes one.
full = 120
# A hit puts this share of a full meter back, and a home run fills it. In
# the arcade game any ball that scores puts this share back.
hit = 0.5

# ---------------------------------------------------------------------------
# The arcade game: hit a target on the outfield.
[arcade]
pitches = 10
# Frames the ball is watched leaving the bat before the view changes.
watch = 39
# Where the target may be put, in pixels of the overhead field.
target = { x = 90.0, y = 140.0, width = 350.0, height = 80.0 }
# A miss up or down the field counts this much more than one to the side.
depth_weight = 1.1
# The rings, from the centre out: a ball that comes down more than `over`
# and no more than `within` from the centre lights the ring and scores its
# points. Each ring scores once a pitch, and the first one scored on a pitch
# counts `first_bonus` times. The rings do not quite meet: a ball that comes
# down in one of the narrow gaps between them scores nothing. That is how
# the original was.
rings = [
    { over = -1.0, within = 10.0, points = 100 },
    { over = 11.0, within = 42.0, points = 75 },
    { over = 43.0, within = 62.0, points = 50 },
    { over = 63.0, within = 85.0, points = 25 },
]
first_bonus = 2

# The final score is the points times this.
[arcade.multiplier]
easy = 1
medium = 2
hard = 3

# ---------------------------------------------------------------------------
# What the batting side looks like.
[team]
# The skin tones batters come in. In a match each batter is given one at
# random.
skins = ["#3c311a", "#594926", "#73652f", "#ab8b43", "#9e8650", "#bba674", "#cbbc81", "#e2ccad"]
# The logos on their bats, in the order the batters come up. Each is the
# name of a frame of the logo in the art.
logos = ["fire", "eagle", "miniclip", "sweetspot", "warclub", "bigbat"]

# ---------------------------------------------------------------------------
# Sound.
[sound]
# How loud each sound is, by its name in the art, from 0 to 1. A sound not
# listed plays at 1.
levels = { introMusic_loop = 0.75, crowd_loop_1 = 0.35, batSwing_fast = 0.2, baseball_organ_FX = 0.3, umpire_out_1 = 0.3, umpire_yourOuttaHere_1 = 0.6 }
# The music that plays on the menu, and the crowd that is heard under a
# game.
music = "introMusic_loop"
crowd = "crowd_loop_1"
