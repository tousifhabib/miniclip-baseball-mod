# Short names for what is run on a change before it is handed over.
# `scripts/check.sh` runs the lot.
[alias]
# Clippy, with anything it says counted as a failure.
lint = "clippy --all-targets -- -D warnings"
# Lays the code out.
tidy = "fmt --all"
# Checks that every file of the art still reads and every reference in it
# still leads somewhere.
art-check = "run --release -p bb-modtools --bin extracted-check -- extracted"
# Builds the docs of everything, what is private included.
docs = "doc --no-deps --document-private-items"

# On Windows the C runtime is built into every program, the tests' as well
# as the app's. The app then runs on a machine that has never had
# Microsoft's runtime for C++ put on it, and the mathematics the record of
# whole games depends on is the program's own, not whatever version of
# Windows' the machine it runs on has.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
